<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KarimGPT</title>
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='%23ececec'/%3E%3Cpath d='M12 4.5a7.5 7.5 0 1 0 7.5 7.5h-7.5z' fill='%23212121'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app sidebar-open">
    <!-- mobile scrim -->
    <div id="scrim" class="scrim"></div>

    <!-- ===================== SIDEBAR ===================== -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3a9 9 0 1 0 9 9" />
              <path d="M12 7a5 5 0 1 0 5 5" />
              <circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/>
            </svg>
          </span>
        </div>
        <button id="collapse-btn" class="icon-btn" title="Close sidebar" aria-label="Close sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9.5 3v18"/></svg>
        </button>
      </div>

      <div class="sidebar-nav">
        <button id="new-chat-btn" class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          <span>New chat</span>
        </button>
        <label class="nav-item search-item" for="search-input">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search-input" type="text" placeholder="Search chats" autocomplete="off" />
        </label>
      </div>

      <nav id="history" class="history" aria-label="Chat history"></nav>

      <div class="sidebar-footer">
        <button id="user-btn" class="user-pill">
          <span class="avatar user-avatar">K</span>
          <span class="user-meta">
            <span class="user-name">Karim</span>
            <span class="user-sub">Builder of KarimGPT</span>
          </span>
        </button>
      </div>
    </aside>

    <!-- ===================== MAIN ===================== -->
    <main id="main" class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button id="open-sidebar-btn" class="icon-btn" title="Open sidebar" aria-label="Open sidebar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9.5 3v18"/></svg>
          </button>
          <button id="topbar-new-chat" class="icon-btn" title="New chat" aria-label="New chat">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          </button>
          <button id="model-btn" class="model-pill" aria-haspopup="menu">
            <span id="model-name">KarimGPT 3</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
        </div>
        <div class="topbar-right">
          <span id="conn-dot" class="conn-dot" title="Backend status"></span>
        </div>
      </header>

      <div id="view" class="view">
        <!-- Conversation -->
        <div id="thread" class="thread" hidden>
          <div id="messages" class="messages"></div>
        </div>

        <button id="scroll-btn" class="scroll-btn" title="Scroll to bottom" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
        </button>

        <!-- Welcome / empty state -->
        <section id="welcome" class="welcome">
          <h1 id="welcome-title">What can I help with?</h1>
          <div id="welcome-slot" class="welcome-slot"></div>
          <div id="suggestions" class="suggestions"></div>
        </section>
      </div>

      <div id="bottom-area" class="bottom-area" hidden>
        <div id="bottom-slot" class="bottom-slot"></div>
        <p class="disclaimer">KarimGPT can make mistakes. Check important info.</p>
      </div>
    </main>
  </div>

  <!-- Composer (moved between welcome-slot and bottom-slot by JS) -->
  <form id="composer" class="composer">
    <textarea id="input" class="input" rows="1" placeholder="Ask anything" autocomplete="off"></textarea>
    <div class="composer-actions">
      <span id="composer-hint" class="composer-hint" hidden></span>
      <button id="send-btn" type="button" class="send-btn" title="Send" aria-label="Send" disabled></button>
    </div>
  </form>

  <!-- Popover menus (positioned by JS) -->
  <div id="model-menu" class="menu model-menu" hidden></div>
  <div id="chat-menu" class="menu chat-menu" hidden></div>
  <div id="user-menu" class="menu user-menu" hidden></div>

  <script src="app.js"></script>
</body>
</html>
